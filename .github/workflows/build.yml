name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Standard: nur lesen. Die Rechte für den Herkunftsnachweis bekommt nur der Build-Job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # für den Herkunftsnachweis (Attestation)
      attestations: write
    steps:
      # Alle Aktionen sind auf eine feste Version (Commit-Prüfsumme) gepinnt:
      # ein späterer Angriff auf eine dieser Aktionen kann unsere Mod nicht verändern.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prüft, dass gradle-wrapper.jar die echte Datei von Gradle ist
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # "build" führt auch den Sicherheits-Check aus (tools/SicherheitsCheck.java).
      # Findet er etwas Verbotenes, bricht der Build ab und es entsteht keine .jar zum Herunterladen.
      - name: Mod bauen und Sicherheits-Check
        run: ./gradlew build

      - name: Prüfsumme (SHA-256)
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS.txt
          {
            echo "## Goldrausch Schießbude"
            echo
            echo "Sicherheits-Check: bestanden"
            echo
            echo "SHA-256 der Mod (muss mit deiner heruntergeladenen Datei übereinstimmen):"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fälschungssicherer Nachweis von GitHub: "diese .jar wurde aus genau diesem Code in diesem Repository gebaut"
      - name: Herkunftsnachweis
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/libs/*.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldrausch-schiessbude
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
