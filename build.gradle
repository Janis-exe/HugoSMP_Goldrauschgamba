plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Terraformers (Mod Menu)"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

loom {
	runs {
		client {
			// Entwickler-Vorschau im Hauptmenü:  ./gradlew runClient -Ppreview=zufall   (oder z. B. -Ppreview=goldticket)
			// Animation wählen mit -Panim=schiessstand | slot | roulette | zufall
			if (project.hasProperty("preview")) {
				property("schiessbude.preview", project.property("preview").toString())
			}
			if (project.hasProperty("anim")) {
				property("schiessbude.previewAnim", project.property("anim").toString())
			}
		}
	}

	mods {
		"schiessbude" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu ist optional: wird nur zum Kompilieren gebraucht.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// ---- Sicherheits-Check (Schutz gegen "geratet werden" über diese Mod) -------------------------------------------
// Prüft die fertige .jar mit tools/SicherheitsCheck.java: nur erlaubte Funktionen, keine versteckten Dateien.
// Schlägt der Check fehl, schlägt der ganze Build fehl - eine unsichere Version kann so nie entstehen.
def modJar = tasks.named("jar").flatMap { it.archiveFile }
def checkerJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath }
def sicherheitsCheck = tasks.register("sicherheitsCheck", Exec) {
	group = "verification"
	description = "Prüft die Mod-Datei auf verbotene Funktionen (Internet, Prozesse, Reflection, Account-Daten ...)."
	dependsOn tasks.named("jar")
	inputs.file(modJar)
	inputs.file("tools/SicherheitsCheck.java")
	executable = checkerJava.get()
	args "-Dstdout.encoding=UTF-8", "tools/SicherheitsCheck.java", modJar.get().asFile.absolutePath
}
tasks.named("check") { dependsOn sicherheitsCheck }
tasks.named("build") { dependsOn sicherheitsCheck }

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Reproduzierbarer Build: gleicher Code ergibt Byte für Byte dieselbe .jar (gleiche SHA-256 wie bei GitHub)
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
